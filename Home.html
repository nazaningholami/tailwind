<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="./src/output.css">
    <title>Document</title>
    <script src="app.js" defer></script>
</head>
<body>
<div>
    <nav class="py-4 px-5 mt-2.5 w-full bg-amber-500 text-gray-200 flex justify-between items-center">
        <h1 class="text-2xl font-bold text-white">بهترین کتاب ها</h1>
        <a href="#" id="btn" class="py-2 px-5 bg-gray-400 text-white rounded-md">اضافه کردن کتاب جدید</a>
    </nav>
    <div id="form" class="w-full h-screen bg-gray-600/40 hidden justify-center items-center">
    <div class="w-1/2 p-4 bg-white mx-auto border h-fit">
        <h1 class="text-4xl font-bold bg-linear-60 text-center text-transparent bg-clip-text from-green-600 to-green-300 pb-4">اضافه کردن کتاب</h1>
        <form class="flex flex-col gap-4">
            <div>
            <label for="name">نام کتاب</label>
            <input class="border border-green-400 focus:outline-0 h-10 w-full" type="text" id="name">
            </div>
            <div>
                <label for="image">عکس کتاب</label>
            <input class="border border-green-400 focus:outline-0 h-10 w-full" type="file" accept="image/*" id="image">
            </div>
            <div>
                <label for="descr">توضیحات</label>
            <textarea id="descr" class="h-20 border border-green-400 w-full resize-none focus:outline-0"></textarea>
            </div>
            <input id="addbtn" type="submit" value="اضافه کردن" class="bg-green-400 rounded-md py-2 text-gray-200"></input>
        </form>
    </div>
    </div>
</div>
</body>
</html>
